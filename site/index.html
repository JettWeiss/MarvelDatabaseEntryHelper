<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Marvel Data Entry Helper</title>
        <link rel="icon" type="image/png" href="Images/FantasticFourLogo.png">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <script type="module" src="./index.js"></script>
        <div id="SubmissionBox">
            <h1>Enter URL to fill fields</h1>
            <input type="text" id="fandomURLInput" placeholder="Fandom Wiki URL">
            <button type="button" id="URLSubmitButton">Submit</button>
            <button type="button" id="SQLSubmitButton">SQL Submit</button>
            
        </div>
        
        <div id="issueDetailsBox">
            <h1>Issue Details</h1>
            <h2>Title:</h2>
            <input class="inputBox" type="text" id="titleInput">
            <h2>Volume</h2>
            <input class="inputBox" type="text" id="volumeInput">
            <h2>Issue Number</h2>
            <input class="inputBox" type="text" id="issueNumInput">
            <h2>Release Date</h2>
            <input class="inputBox" type="text" id="releaseDateInput">
            <h2>Cover Date</h2>
            <input class="inputBox" type="text" id="coverDateInput">
        </div>

        <div id="storyBox">
            
        </div>
    </body>
</html>
